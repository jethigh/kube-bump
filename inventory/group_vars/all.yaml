# Docelowa wersja Kubernetes (zmieniaj maksymalnie o 1 wersję minor naraz!)
k8s_target_version: "1.32.2"
k8s_minor_version: "{{ k8s_target_version.split('.')[0:2] | join('.') }}"

# Automatyczne snapshoty VM na hoście przed startem aktualizacji (VirtualBox)
vbox_snapshot_enabled: true
vbox_snapshot_prefix: "pre-kube-bump"

# Backup etcd przed aktualizacją Control Plane (wymaga pakietu etcd-client na CP)
etcd_backup_enabled: true
etcd_backup_dir: "/var/backups/kube-bump"
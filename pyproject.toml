[project]
name = "moj-projekt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # zwykłe biblioteki projektu, np. "httpx>=0.28"
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
]

# --- Konfiguracja Ruffa ---

[tool.ruff]
target-version = "py312" # dopasuj do projektu
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle + pyflakes
    "I",            # isort (kolejność importów)
    "UP",           # pyupgrade (nowoczesne typy, f-stringi, składnia)
    "B",            # flake8-bugbear (B006 mutable defaults, B904 raise from)
    "SIM",          # flake8-simplify (SIM115 context managers)
    "PTH",          # flake8-use-pathlib
    "S",            # flake8-bandit (subprocess shell=True, assert, secrets)
    "BLE",          # flake8-blind-except
    "DTZ",          # flake8-datetimez (wymusza timezone-aware datetime)
    "G",            # flake8-logging-format (zakaz f-stringów w loggerze)
    "T20",          # flake8-print (zakaz print() poza CLI)
    "PLW",          # pylint warnings (m.in. subprocess check=True, encoding)
    "RUF",          # reguły specyficzne dla Ruffa
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"] # assert jest OK w testach
"**/cli.py" = ["T201"]     # print() jest OK w warstwie CLI